# CORTANA — all tunables. No magic numbers in code.

[models]
fast       = ""
primary    = "gemma4:e4b"   # switched from gemma4:12b - elastic model, 3.2GB resident vs
                             # ~9.8GB, tested against A8's tool-calling demands (selection,
                             # JSON well-formedness, no invented tools, multi-step chaining)
                             # and matched gemma4:12b on every case. See CLAUDE.md.
heavy      = ""
alt        = ""
endpoint   = "http://localhost:11434"
keep_alive = "30m"
# Explicit num_ctx for every primary-model call (services/brain/client.py) - Ollama's
# own unconfigured default measured 4096 live (`ollama ps`), and persona.md alone
# already consumes 3295 of those tokens (measured via a real call's
# prompt_eval_count) - leaving almost no room for profile.md, retrieved fragments,
# or actual conversation before A6's rolling-context trigger would fire on every
# single turn. Raised to 16384 - measured real VRAM cost of that jump (nvidia-smi,
# e4b alone, same prompt): ~4096->32768 (8x) cost only ~475MB more resident, so
# 16384 is cheap against the model's own 131072 max, not a VRAM risk.
context_window = 16384

[thinking]
# Defaults only — services/brain/client.py takes `think` as a per-call argument,
# never a global toggle, so any one call site (CAD, heavy mode) can turn it on
# without affecting the conversational path. These values are what each call
# site should pass by default.
conversational = false   # voice loop (A1-A5) — never wait on hidden reasoning
cad            = true    # A14 CAD generation and verification loop
heavy          = true    # B3 heavy-tier reasoning mode

[audio]
sample_rate = 16000
frame_size  = 512   # samples/frame (32ms @ 16kHz) — silero-vad requires exactly this; openWakeWord buffers across frames so it works fine at this size too

[audio.wake]
model      = "config/models/wake/hey_cortana.onnx"   # trained model — see services/ears/WAKE_TRAINING.md
threshold  = 0.5
debounce_s = 2.0   # ignore new detections within this long of the last one — openWakeWord's internal embedding window (~1-2s) still holds the wake phrase right after a detection, so short utterances can spuriously re-trigger the instant we return to listening

# Second-stage verification: confidence score alone doesn't separate real detections
# from false accepts (calibration runs showed a false accept at 0.987, above most real
# hits) — so on any trigger, run STT on the buffered audio and require the wake phrase
# actually appears before entering RECORDING. Costs one STT call (~150-680ms observed)
# per trigger only, not per frame.
verify              = true
verify_phrase       = "cortana"   # substring (case-insensitive) the verification transcript must contain
verify_lookback_ms  = 1500       # audio before the trigger frame to include — openWakeWord's detection can fire after the phrase already started
verify_lookahead_ms = 500        # additional audio captured after the trigger frame before running the verification transcription

[audio.vad]
threshold                = 0.5
# 600ms, not the 300ms A2 shipped with. scripts/vad_pause_test.py measured real
# hesitation gaps (mid-sentence, before a number, reaching for a word) at 582-1822ms
# - every threshold in the 300-500ms range clipped the same speech identically, and a
# value that never clips (~2s) would tax every single turn with that much trailing
# silence. Stopped tuning the threshold; backchannel prompting (below) covers the
# error case instead - the cost of guessing wrong is a short "go on?", not silence
# or a mangled transcript.
min_silence_duration_ms  = 600
speech_pad_ms            = 30
max_utterance_s          = 15    # safety cutoff if VAD never sees enough silence to end on its own (false wake trigger, user walks away mid-sentence)

[audio.backchannel]
# On VAD endpoint, services/ears/completeness.py checks whether the transcript looks
# finished or abandoned (non-LLM heuristic - VRAM on the 3080 Ti is already over
# capacity with gemma4:12b + Whisper + XTTS resident, see CLAUDE.md, so this can't be
# a [models].fast call the way it was first scoped). If abandoned, a pre-rendered
# line plays instead of passing the fragment to the brain (services/ears/
# backchannel_pool.py - never generated live, that would already have missed its
# moment), and the pipeline listens for a resume without requiring the wake word
# again. See services/ears/backchannel.py for the state machine.
enabled           = true
resume_window_s   = 4.0     # how long to listen for a resume before giving up and finalizing
base_cooldown_s   = 20.0    # minimum spacing between any two backchannels
escalation_factor = 3.0     # cooldown multiplier per consecutive unanswered prompt
max_cooldown_s    = 300.0   # cap on escalated cooldown
pool_min_size     = 5       # regenerate when the pool drops to this size
pool_target_size  = 10
# Listening verdict on the first pool: too loud, and the reference/pace read as
# clipped/businesslike rather than someone actually listening. Three per-context
# overrides on the shared XTTS engine (services/ears/backchannel_pool.py), applied
# only to backchannel synthesis - real responses stay on [voice.xtts]'s calm/1.0.
reference  = "soft"   # named reference from [voice.xtts.references] - softer/more human
                       # than "calm". The retry mitigation in backchannel_pool.py already
                       # covers soft's measured short-text rambling risk.
speed      = 0.88     # slower reads as warm; the 1.0 default read as clipped for 1-2 word lines.
# Stacks additively in dB with [voice].output_gain_db (both are plain multiplicative
# gains applied in sequence - see tts.py's _output_gain()) - re-check this whenever
# that changes, they're not independent. -8 was calibrated against a 0dB master; at
# output_gain_db=-20 that measured 10.6dB under a normal response (voice_refs/
# audition/backchannel_vs_master/, see CLAUDE.md) - too buried. A backchannel's dry
# level is already ~2.6dB under a response's from being short/soft-referenced/slow,
# before any volume_db attenuation at all - -2 lands it about 4.6dB under: audible
# separation without disappearing.
volume_db  = -2.0     # backchannels sit under the conversation, not competing with it.

[audio.stt]
model        = "large-v3-turbo"
device       = "cuda"
compute_type = "float16"
language     = "en"

[voice]
engine        = "xtts"   # "kokoro" (fast dev baseline) or "xtts" (production, cloned voice — see PROMPTS.md A3 step 3)
synth_workers = 1        # concurrent sentence-synthesis workers in speak_stream() - see tts.py
# How speak_stream() groups tokens into synthesis calls - see tts.py's _CONSUMERS /
# _STREAM_CONSUMERS. Six-way comparison on a realistic multi-sentence response
# (TTFA / max mid-response gap / total time, CLAUDE.md has full numbers):
#   per_sentence      - each sentence its own call. 367ms TTFA, but an 819ms gap and
#                       XTTS conditions on isolated text, which measurably changes
#                       delivery character (see CLAUDE.md's path-divergence investigation).
#   whole_text        - the entire response as one call. Best delivery character, zero
#                       streaming - no audio until generation finishes (5056ms TTFA).
#   hybrid            - sentence 1 alone, everything after as one call. 319ms TTFA but
#                       a 3616ms mid-response gap chunking alone can't close.
#   hybrid3           - sentence 1, sentences 2-3, remainder. 372ms TTFA, 2986ms gap -
#                       better than hybrid, still not closed.
#   inference_stream  - whole response as one Xtts.inference_stream() call, played as
#                       it generates. 0ms gaps, but 1064ms TTFA (waits for the full
#                       token stream before starting synthesis).
#   buffered_stream   - inference_stream fired as soon as the trigger condition
#                       completes, remainder as a second inference_stream call.
#                       615ms TTFA, 0ms gaps, fastest total time in the original
#                       six-way comparison. Default as of that listening verdict -
#                       both TTFA and gap-free, no tradeoff needed.
#                       A5 (2026-08-04): trigger tightened in two steps, both
#                       measured on real speak_stream() runs
#                       (scripts/compare_buffered_triggers.py). 2-sentences-or-
#                       300-chars -> 1-sentence-or-150-chars: 572ms -> 394ms TTFA,
#                       same 0ms max gap. Then 1-sentence-alone (no char
#                       co-trigger): 301ms TTFA, a small real gap (118ms) -
#                       listening verdict: inaudible, landed as the default.
#                       _BUFFERED_START_CHAR_THRESHOLD (150 -> 250) is now a pure
#                       safety net for an abnormally long sentence 1, not a
#                       second active trigger path.
strategy      = "buffered_stream"
# Master output level - one place covering every playback path (play_audio(),
# _play_all() - backchannels and real responses alike), applied in tts.py after
# the level ramp below, not before (the ramp reasons about relative levels
# between utterances; this is a final absolute-level multiply on top of that,
# with no feedback into ramp state - see _output_gain()'s docstring). Stacks
# additively in dB with [audio.backchannel].volume_db - re-check that value
# whenever this changes, they're not independent (see its comment above).
output_gain_db = -20.0

[voice.level_ramp]
# Volume continuity across utterances (tts.py's _ramp_gain/_record_played_level) -
# without this, every utterance synthesizes at a fixed level with no memory of the
# last one, so a soft backchannel could be immediately followed by a full-volume
# response. Real conversation doesn't jump like that - after speaking quietly, the
# next thing is usually also quiet, then it drifts back up over a couple of turns.
# Only ever attenuates toward continuity, never boosts an utterance louder than its
# natural level.
enabled  = true
window_s = 6.0   # only cap volume if the next utterance starts within this long of the last one actually played
step_db  = 6.0   # max loudness increase per utterance while ramping - recovers to natural level over a few utterances, not instantly

[voice.normalize]
# services/voice/normalize.py spells out all-caps 2-5 letter runs letter-by-letter
# by default ("PLA" -> "P. L. A.") - XTTS reads them as a mispronounced regular
# word otherwise ("PLA" came out "player.a"). This list is the exception: acronyms
# actually pronounced as a single word. Moved here (not hardcoded in normalize.py)
# specifically so it can grow without a code change - but every entry still needs
# the same verification any acronym here has had: synthesize both readings
# (unspelled and letter-spelled), transcribe both, keep whichever the transcript
# recovers (scripts/test_acronym_pronunciation.py runs exactly this test). Never
# add an entry just because it looks like a word on paper - PETG looked like one
# and tested badly wrong both ways; STEP looked safely letters-only and tested the
# other way (spelled out, it mis-transcribed to "STP"; unspelled, it read clean).
# CAD/RADAR/GIF/JPEG transcribed correctly both spelled and unspelled (genuinely
# ambiguous by that test alone) - added here on real-world spoken convention
# (nobody spells out "radar" or "jpeg" in speech), not the transcript test alone.
# PNG tested the same kind of ambiguous but was deliberately left off - convention
# says people spell it ("P-N-G"), unlike JPEG/GIF's adopted word pronunciations.
word_acronyms = [
    "NASA", "OK",
    "CAD", "STEP", "LASER", "RADAR", "SCUBA", "GIF", "JPEG", "RAM", "ROM",
]

[voice.kokoro]
lang_code = "a"        # 'a' = American English (misaki G2P language code)
voice     = "af_heart"
speed     = 1.0

[voice.xtts]
language = "en"
device   = "cuda"
# Which [voice.xtts.references] entry XTTSEngine.use_reference() switches to at
# startup. The logic for switching mid-session (calm vs soft) comes later with the
# persona work - for now this is just the default engine.py's factory passes through.
default_reference = "calm"

# Inference parameters - see services/voice/xtts_engine.py's synthesize() for how
# these get passed to Xtts.inference(). Defaults below are XTTS's own library
# defaults; tune here after listening to scripts/xtts_param_sweep.py's output, not
# by hardcoding overrides in code.
temperature         = 0.75   # lower flattens delivery, higher adds variation but risks artifacts
repetition_penalty  = 10.0
length_penalty      = 1.0
top_k               = 50
top_p               = 0.85
speed               = 1.0

[voice.xtts.references]
# Picked by ear from voice_refs/audition/ output. Both cleared prep_voice_refs.py's
# cleanliness filters (SNR/spectral-flatness) and the radio-filter check.
calm = "voice_refs/calm/voice_ref_14.wav"   # normal responses (calm_14)
soft = "voice_refs/new/full_clip.wav"       # softer/more human moments - picked despite being
                                             # past XTTS's ~30s useful reference length; the full
                                             # 44.7s clip won by ear anyway

[voice.prep_refs]
# scripts/prep_voice_refs.py — PROMPTS.md A3 step 2
source_dir           = "voice_source"   # gitignored; drop cloning source audio/video here
export_dir            = "voice_refs"
export_sample_rate    = 24000   # mono, high enough for XTTS reference quality without keeping full 48kHz
min_duration_s        = 6.0     # candidates outside [min, max] are dropped, not truncated
max_duration_s        = 25.0
top_n                 = 15
min_snr_db            = 15.0    # segment RMS vs. its own leading/trailing-silence noise floor
max_spectral_flatness = 0.3     # 0=tonal/voiced, 1=noise-like; rejects hiss/static, not music-bed (that needs listening)
min_avg_logprob       = -1.0    # faster-whisper's own low-confidence heuristic
max_no_speech_prob    = 0.5

# --rank-by calm: same filters above still gate candidates in; these just change how
# survivors are ranked and how many get exported, aimed at calm/level delivery instead
# of raw acoustic quality (see scripts/prep_voice_refs.py).
calm_top_n             = 20
radio_band_low_hz      = 300.0
radio_band_high_hz     = 3400.0
radio_in_band_threshold = 0.75   # flag as likely comms/radio-filtered if >= this fraction of
                                  # spectral power falls inside [low_hz, high_hz]. Calibrated
                                  # against cortana_lines.mp4.mp4: unfiltered lines cluster at
                                  # 0.41-0.63, one genuinely radio-chattery segment hit 0.85 -
                                  # an initial guess of 0.97 missed it entirely. Still a
                                  # heuristic - re-check this gap if a new source behaves
                                  # differently.

[brain.barge_in]
# services/brain/loop.py's on_wake hook fires on every wake trigger, including the
# one that starts a brand new turn - not just genuine interruptions. Gate: only
# cancel the in-flight response task if it has actually been playing audio (per
# services/voice/tts.py's response_playback_elapsed_s()) for at least this long.
# Guards against killing a response that hasn't produced any audio yet (still
# mid-LLM-stream or mid-synthesis) - there's nothing to barge in on yet, so
# cancelling there only destroys work for no perceptible benefit.
min_playback_s = 0.3

[latency]

[memory]
# PROMPTS.md A6/A7 - hand-rolled, not Letta (see PLAN.md's Phase 2 section for why:
# Letta's default embedding path is cloud/OpenAI, its Ollama provider is real and
# fully local, but installing the full `letta` server into this project's shared
# venv silently downgrades onnxruntime 1.28.0->1.20.1 - openWakeWord's dependency,
# already hand-tuned - plus protobuf and wrapt; and its core design is a MemGPT-
# style agent that manages memory via its own LLM function-calls, adding per-turn
# round trips this project's latency budget doesn't have room for. This project's
# actual spec is three deterministic steps, not an autonomous agent.
db_path                     = "memory_store/store.db"
embedding_model             = "nomic-embed-text"   # local via Ollama, not cloud - see CLAUDE.md VRAM findings
embedding_dim               = 768
# Measured resident cost (nvidia-smi, real /api/embed call): ~572MB on top of the
# full e4b+Whisper+XTTS stack, leaving ~1956MB free - comfortable. A resident fast
# chat model (qwen2.5:1.5b) on top of *that* left only 585MB free - too thin given
# this project's own prior finding that a similar margin (217MB, gemma4:12b) still
# regressed a later call to a 6.1s reload. So: embedding model stays resident,
# summarization does not - see rolling_summary_model below.
embedding_keep_alive        = "30m"
retrieval_top_k             = 8      # top 5-10 requested; 8 as a reasonable middle default
rolling_fill_threshold      = 0.70   # fraction of [models].context_window that triggers compression
rolling_chunk_messages      = 4      # oldest N raw messages folded into the summary per pass
rolling_min_recent_messages = 4      # always left raw/uncompressed, even if fill is over threshold
# No resident fast model fits alongside the current stack with real headroom (see
# embedding_dim comment above) - summarization uses [models].primary instead, but
# always fires as a background asyncio task after the turn's response has already
# been spoken, never inline, so it can never add latency to the response the user
# is waiting on. Real cost of this choice: if the user starts a new turn while a
# summarization call is still in flight, Ollama serializes both calls to the same
# model, so that next turn's TTFT absorbs the wait instead. Accepted for now -
# summarization is one bounded-size call, not a repeating cost.
