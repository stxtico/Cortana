# CORTANA — all tunables. No magic numbers in code.

[models]
fast       = ""
primary    = "gemma4:12b"
heavy      = ""
alt        = ""
endpoint   = "http://localhost:11434"
keep_alive = "30m"

[thinking]
# Defaults only — services/brain/client.py takes `think` as a per-call argument,
# never a global toggle, so any one call site (CAD, heavy mode) can turn it on
# without affecting the conversational path. These values are what each call
# site should pass by default.
conversational = false   # voice loop (A1-A5) — never wait on hidden reasoning
cad            = true    # A14 CAD generation and verification loop
heavy          = true    # B3 heavy-tier reasoning mode

[audio]
sample_rate = 16000
frame_size  = 512   # samples/frame (32ms @ 16kHz) — silero-vad requires exactly this; openWakeWord buffers across frames so it works fine at this size too

[audio.wake]
model      = "hey_jarvis"   # stand-in bundled openWakeWord model — no "hey cortana" model exists yet, needs training on real voice samples (see services/ears/WAKE_TRAINING.md)
threshold  = 0.5
debounce_s = 2.0   # ignore new detections within this long of the last one — openWakeWord's internal embedding window (~1-2s) still holds the wake phrase right after a detection, so short utterances can spuriously re-trigger the instant we return to listening

# Second-stage verification: confidence score alone doesn't separate real detections
# from false accepts (calibration runs showed a false accept at 0.987, above most real
# hits) — so on any trigger, run STT on the buffered audio and require the wake phrase
# actually appears before entering RECORDING. Costs one STT call (~150-680ms observed)
# per trigger only, not per frame.
verify              = true
verify_phrase       = "jarvis"   # substring (case-insensitive) the verification transcript must contain
verify_lookback_ms  = 1500       # audio before the trigger frame to include — openWakeWord's detection can fire after the phrase already started
verify_lookahead_ms = 500        # additional audio captured after the trigger frame before running the verification transcription

[audio.vad]
threshold                = 0.5
min_silence_duration_ms  = 300   # trailing silence required before an utterance is considered ended
speech_pad_ms            = 30
max_utterance_s          = 15    # safety cutoff if VAD never sees enough silence to end on its own (false wake trigger, user walks away mid-sentence)

[audio.stt]
model        = "large-v3-turbo"
device       = "cuda"
compute_type = "float16"
language     = "en"

