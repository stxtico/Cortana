[project]
name = "cortana"
version = "0.1.0"
description = "Local voice assistant + agent"
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.8.0",
    "coqui-tts[codec]>=0.27.5",
    "crawl4ai>=0.9.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "keyboard>=0.13.5",
    "kokoro>=0.9.4",
    "numpy>=1.24,<2.5",
    "nvidia-cublas-cu12>=12.9.2.10",
    "openpyxl>=3.1.5",
    "openwakeword>=0.4.0",
    "pdfplumber>=0.11.10",
    "pillow>=11.0.0",
    "playwright>=1.48.0",
    "psutil>=7.2.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pywin32>=312",
    "pywinauto>=0.6.9",
    "reportlab>=5.0.0",
    "send2trash>=2.1.0",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "sqlite-vec>=0.1.9",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "transformers>=4.57,<5.1",
    "winotify>=1.1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
