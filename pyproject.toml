[project]
name = "cortana"
version = "0.1.0"
description = "Local voice assistant + agent"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "openwakeword>=0.4.0",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
]
